# Baut bei jedem Push auf main das PDF und legt es in das Release "latest".
# Download immer unter:
#   https://github.com/erklaerpierre/monsterbuffet/releases/download/latest/Monsterbuffet.pdf
name: PDF bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: PDF bauen
        run: python build.py

      - name: Release "latest" ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest output/Monsterbuffet.pdf \
            --title "Monsterbuffet (aktueller Stand)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7} am $(date -u +'%Y-%m-%d %H:%M') UTC." \
            --target "$GITHUB_SHA" \
            --latest
